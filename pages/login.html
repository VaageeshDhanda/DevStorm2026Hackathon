<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPark — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">P</div>
        <div class="logoText">
          <b>SmartPark</b>
          <small>IoT Parking Assistant</small>
        </div>
      </div>

      <h1>Admin Sign In</h1>
      <p class="subtitle">Access the parking control dashboard</p>

      <div id="alertBox" class="alert alert-error" role="alert" hidden></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required
            autocomplete="username"
            maxlength="64"
            spellcheck="false"
            autofocus
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              required
              autocomplete="current-password"
              maxlength="128"
            >
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" title="Show password">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="row-options">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loading" hidden>Signing in…</span>
        </button>
      </form>

      <div class="login-footer">
        <span class="secure-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Admin access only
        </span>
      </div>
    </div>

    <p class="page-foot">SmartPark IoT Platform · Authorized personnel only</p>
  </div>

  <script src="login.js"></script>
</body>
</html>
